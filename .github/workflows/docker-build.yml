name: CI/CD - Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract KEYCLOAK_VERSION from app.json
        id: version
        run: |
          KEYCLOAK_VERSION=$(python3 -c "import json; print(json.load(open('app.json'))['env']['KEYCLOAK_VERSION']['value'])")
          echo "KEYCLOAK_VERSION=$KEYCLOAK_VERSION" >> $GITHUB_OUTPUT
          echo "Using Keycloak version: $KEYCLOAK_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: keycloak-heroku:${{ steps.version.outputs.KEYCLOAK_VERSION }}
          build-args: |
            KEYCLOAK_VERSION=${{ steps.version.outputs.KEYCLOAK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify shell script syntax
        run: |
          bash -n start-keycloak.sh
          echo "✓ start-keycloak.sh syntax verified"

      - name: Verify configuration files
        run: |
          python3 -m json.tool app.json > /dev/null
          echo "✓ app.json is valid"
