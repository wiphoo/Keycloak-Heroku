name: TruffleHog Security Scan

on:
  push:
    branches: [ main, copilot/deploy-keycloak-heroku ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for accurate scanning
        
    - name: TruffleHog Scan for Secrets
      uses: trufflesecurity/trufflehog@main
      with:
        # Scan the entire repository
        path: ./
        # Scan git history
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified
        
    - name: TruffleHog Filesystem Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        filesystem: true
        extra_args: --debug --only-verified
        
    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trufflehog-scan-results
        path: trufflehog-results/
        retention-days: 30
